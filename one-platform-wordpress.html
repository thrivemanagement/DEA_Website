<!--
  ONE PLATFORM — paste this whole file into a WordPress "Custom HTML" block.
  The ONE Platform disc in the center with 8 areas around it (4 per side).
  Hover or click an area to open its description.

  To customize, scroll to "EDIT HERE" in the <script> at the bottom.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: left column of 4 pills, the ONE Platform disc, right column of 4 pills; dotted connectors drawn between them; description card below (inline under the pill on phones). All rules are scoped to .one-orbit. */
.one-orbit {
  --oo-bg: #f7fbfe;
  --oo-surface: #ffffff;
  --oo-ink: #0b1f4b;
  --oo-muted: #4f5f7a;
  --oo-line: #e2eaf3;
  --oo-navy: #04173d;
  --oo-glow: #2fb8ff;
  --oo-font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --c: #2fb8ff;      /* active area's line color, set by the script */
  --tuck-x: clamp(0px, 3.2vw, 44px);
}
.one-orbit, .one-orbit *, .one-orbit *::before, .one-orbit *::after { box-sizing: border-box; }
.one-orbit [hidden] { display: none !important; }
.one-orbit {
  position: relative;
  background:
    radial-gradient(60% 50% at 50% 42%, rgb(47 184 255 / .10), transparent 70%),
    var(--oo-bg);
  color: var(--oo-ink);
  font: 400 1rem/1.55 var(--oo-font);
  -webkit-font-smoothing: antialiased;
  padding: clamp(2rem, 5vw, 4rem) 16px;
  margin: 0;
  overflow: hidden;
}
.one-orbit .oo-wrap { max-width: 1200px; margin-inline: auto; display: grid; gap: clamp(1.5rem, 3vw, 2.5rem); }
.one-orbit .oo-hint { margin: 0; text-align: center; color: var(--oo-muted); font-size: .95rem; font-weight: 500; }

/* ---------- Stage ---------- */
.one-orbit .oo-stage {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  column-gap: clamp(2.5rem, 6vw, 5.5rem);
}
.one-orbit .oo-col { display: grid; gap: clamp(1rem, 2.4vw, 1.75rem); position: relative; z-index: 2; }
.one-orbit .oo-col--left { justify-items: end; }
.one-orbit .oo-col--right { justify-items: start; }
.one-orbit .oo-links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 1; }

/* ---------- Pills ---------- */
.one-orbit button.oo-pill {
  all: unset; box-sizing: border-box;
  --pc: #2fb8ff; --pt: #dcf4fd; --pi: #7cc8f0;
  position: relative;
  display: flex; align-items: center; gap: 1rem;
  width: min(100%, 25rem);
  min-height: clamp(84px, 8vw, 104px);
  padding: .55rem;
  border-radius: 999px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--pt) 60%, #fff), var(--pt));
  border: 1.5px solid color-mix(in srgb, var(--pc) 28%, #fff);
  box-shadow: 0 10px 30px -14px color-mix(in srgb, var(--pc) 55%, transparent), inset 0 1px 0 #fff;
  cursor: pointer; overflow: hidden; isolation: isolate;
  font-family: var(--oo-font); color: var(--oo-ink);
  transition: transform .35s cubic-bezier(.2,1.2,.4,1), box-shadow .35s, border-color .3s, opacity .3s;
  -webkit-tap-highlight-color: transparent;
  animation: oo-in .7s cubic-bezier(.2,1,.3,1) backwards;
  animation-delay: calc(var(--i) * 70ms + 200ms);
}
.one-orbit .oo-col--left .oo-pill { flex-direction: row-reverse; text-align: right; padding-left: 1.75rem; --dir: 1; }
.one-orbit .oo-col--right .oo-pill { padding-right: 1.75rem; --dir: -1; }
/* Top and bottom pills tuck in toward the round disc. */
.one-orbit .oo-col--left .oo-pill[data-row="0"], .one-orbit .oo-col--left .oo-pill[data-row="3"] { translate: var(--tuck-x) 0; }
.one-orbit .oo-col--right .oo-pill[data-row="0"], .one-orbit .oo-col--right .oo-pill[data-row="3"] { translate: calc(var(--tuck-x) * -1) 0; }

.one-orbit .oo-pill::after { /* shine sweep on hover */
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(105deg, transparent 35%, rgb(255 255 255 / .85) 50%, transparent 65%);
  transform: translateX(-120%); transition: transform 0s;
}
.one-orbit .oo-icon {
  flex: none; position: relative;
  width: clamp(64px, 6.4vw, 84px); aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--pi) 55%, #fff), var(--pi) 70%);
  box-shadow: 0 8px 20px -8px var(--pc), inset 0 2px 0 rgb(255 255 255 / .6);
  color: var(--oo-ink);
  transition: transform .45s cubic-bezier(.2,1.5,.4,1), box-shadow .35s;
}
.one-orbit .oo-icon svg { width: 52%; height: auto; }
.one-orbit .oo-icon::before { /* pulse ring when active */
  content: ""; position: absolute; inset: -4px; border-radius: 50%;
  border: 2px solid var(--pc); opacity: 0;
}
.one-orbit .oo-text { display: grid; gap: .1rem; min-width: 0; }
.one-orbit .oo-name { font-weight: 800; font-size: clamp(1.05rem, 1.65vw, 1.4rem); line-height: 1.15; letter-spacing: -.015em; }
.one-orbit .oo-sub { font-weight: 500; font-size: clamp(.92rem, 1.35vw, 1.15rem); color: var(--oo-ink); opacity: .85; }

.one-orbit .oo-pill:hover, .one-orbit .oo-pill:focus-visible, .one-orbit .oo-pill.active {
  transform: translate(calc(var(--dir) * 6px), -3px);
  border-color: var(--pc);
  box-shadow: 0 18px 40px -14px var(--pc), 0 0 0 4px color-mix(in srgb, var(--pc) 16%, transparent), inset 0 1px 0 #fff;
}
.one-orbit .oo-pill:hover::after { transform: translateX(120%); transition: transform .8s ease; }
.one-orbit .oo-pill:hover .oo-icon, .one-orbit .oo-pill.active .oo-icon { transform: scale(1.08) rotate(calc(var(--dir) * -8deg)); }
.one-orbit .oo-pill.active .oo-icon::before { animation: oo-ripple 1.8s ease-out infinite; }
.one-orbit .oo-pill:focus-visible { outline: 3px solid var(--oo-ink); outline-offset: 4px; }
.one-orbit .is-active .oo-pill:not(.active):not(:hover) { opacity: .72; }

/* ---------- Center disc ---------- */
.one-orbit .oo-hub {
  position: relative; z-index: 2;
  width: clamp(240px, 27vw, 340px); aspect-ratio: 1;
  display: grid; place-items: center;
}
.one-orbit .oo-halo { position: absolute; inset: -14%; width: 128%; height: 128%; overflow: visible; pointer-events: none; }
.one-orbit .oo-halo circle { fill: none; transform-origin: 50% 50%; transform-box: view-box; transition: stroke .5s; }
.one-orbit .oo-halo .h1 { stroke: color-mix(in srgb, var(--c) 35%, transparent); stroke-width: .4; }
.one-orbit .oo-halo .h2 { stroke: color-mix(in srgb, var(--c) 55%, transparent); stroke-width: .5; stroke-dasharray: .6 2.4; animation: oo-spin 60s linear infinite; }
.one-orbit .oo-halo .h3 { stroke: var(--c); stroke-width: .9; stroke-linecap: round; stroke-dasharray: 18 300; animation: oo-spin 9s linear infinite; opacity: .9; }
.one-orbit .oo-halo .h4 { stroke: var(--oo-glow); stroke-width: .7; stroke-linecap: round; stroke-dasharray: 10 300; animation: oo-spin 14s linear infinite reverse; opacity: .6; }

.one-orbit .oo-disc {
  position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 50% 35%, #0a2d6e, var(--oo-navy) 62%, #020b24);
  box-shadow:
    0 0 0 3px color-mix(in srgb, var(--c) 70%, #fff),
    0 0 0 9px color-mix(in srgb, var(--c) 18%, transparent),
    0 0 50px 4px color-mix(in srgb, var(--c) 45%, transparent),
    0 30px 60px -20px rgb(4 23 61 / .6);
  transition: box-shadow .5s, transform .3s ease-out;
  transform: perspective(800px) rotateX(var(--ry, 0deg)) rotateY(var(--rx, 0deg));
}
.one-orbit .oo-globe { position: absolute; inset: 0; width: 100%; height: 100%; }
.one-orbit .oo-globe .gd { fill: #8fe3ff; animation: oo-twinkle 3s ease-in-out infinite; }
.one-orbit .oo-logo { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; padding-bottom: 14%; color: #fff; }
.one-orbit .oo-logo svg { width: 64%; height: auto; overflow: visible; }
.one-orbit .oo-disc img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; margin: 0; object-fit: cover; }
.one-orbit .has-image .oo-logo, .one-orbit .has-image .oo-globe { display: none; }

/* ---------- Connectors ---------- */
.one-orbit .oo-link { fill: none; stroke: var(--lc); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 0 6; opacity: .75; transition: opacity .3s, stroke-width .3s; }
.one-orbit .oo-link.on { opacity: 1; stroke-width: 3; animation: oo-flow .6s linear infinite; }
.one-orbit .oo-end { fill: var(--lc); stroke: #fff; stroke-width: 2; }
.one-orbit .oo-spark { fill: #fff; stroke: var(--lc); stroke-width: 3; opacity: 0; }

/* ---------- Description card ---------- */
.one-orbit .oo-detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.2,.7,.2,1); width: min(100%, 760px); justify-self: center; }
.one-orbit .oo-detail.open { grid-template-rows: 1fr; }
.one-orbit .oo-clip { overflow: hidden; min-height: 0; padding: 4px 24px 32px; margin: -4px -24px -32px; }
.one-orbit .oo-stack { display: grid; align-items: start; transition: height .4s cubic-bezier(.2,.7,.2,1); }
.one-orbit .oo-card {
  --pc: #2fb8ff; --pt: #dcf4fd;
  grid-area: 1 / 1;
  position: relative; overflow: hidden;
  background: var(--oo-surface);
  border: 1px solid var(--oo-line);
  border-radius: 18px;
  box-shadow: 0 16px 40px -20px rgb(11 31 75 / .35);
  padding: clamp(1.25rem, 3vw, 1.75rem) clamp(1.25rem, 3vw, 2rem) clamp(1.25rem, 3vw, 1.75rem) calc(clamp(1.25rem, 3vw, 2rem) + 4px);
  display: grid; gap: .65rem; justify-items: start; align-content: start;
  opacity: 0; visibility: hidden; transform: translateY(10px);
  transition: opacity .3s, transform .45s cubic-bezier(.2,.7,.2,1), visibility 0s .3s;
}
.one-orbit .oo-card.show { opacity: 1; visibility: visible; transform: none; transition: opacity .3s, transform .45s cubic-bezier(.2,.7,.2,1), visibility 0s; }
.one-orbit .oo-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--pc); }
.one-orbit .oo-card::after {
  content: ""; position: absolute; top: -70px; right: -70px; width: 170px; height: 170px; border-radius: 50%;
  background: var(--pt); opacity: .7; z-index: 0;
}
.one-orbit .oo-card > * { position: relative; z-index: 1; }
.one-orbit .oo-tag {
  display: inline-block; padding: .45em 1em; border-radius: 99px;
  background: var(--pt); color: var(--oo-ink);
  font: 800 .72rem/1 var(--oo-font); letter-spacing: .06em; text-transform: uppercase;
}
.one-orbit .oo-card h3 {
  margin: .15rem 0 0; padding: 0; color: var(--oo-ink); text-transform: none; letter-spacing: -.015em;
  font: 800 clamp(1.3rem, 2.6vw, 1.7rem)/1.2 var(--oo-font); text-wrap: balance;
}
.one-orbit .oo-card p { margin: 0; padding: 0; color: var(--oo-muted); font-size: 1.05rem; max-width: 60ch; }
.one-orbit .oo-foot { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between; width: 100%; padding-top: .5rem; }
.one-orbit .oo-nav { display: flex; gap: .5rem; margin-left: auto; }
.one-orbit .oo-btn {
  all: unset; box-sizing: border-box; display: inline-block; cursor: pointer;
  font: 700 .9rem/1 var(--oo-font); color: var(--oo-ink);
  border: 1.5px solid var(--oo-line); background: var(--oo-surface);
  border-radius: 99px; padding: .75em 1.15em; text-decoration: none;
  transition: border-color .2s, transform .2s, background .2s;
}
.one-orbit .oo-btn:hover { border-color: var(--pc); transform: translateY(-2px); color: var(--oo-ink); text-decoration: none; }
.one-orbit .oo-btn:focus-visible, .one-orbit .oo-close:focus-visible { outline: 3px solid var(--pc); outline-offset: 2px; }
.one-orbit .oo-btn--fill, .one-orbit .oo-btn--fill:hover { background: var(--pc); border-color: var(--pc); color: #fff; }
.one-orbit .oo-close {
  all: unset; box-sizing: border-box; position: absolute; top: .8rem; right: .8rem; z-index: 2; width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; color: var(--oo-ink); font: 400 1.5rem/1 var(--oo-font);
  background: rgb(255 255 255 / .7); transition: background .2s;
}
.one-orbit .oo-close:hover { background: #fff; }

@keyframes oo-spin { to { transform: rotate(360deg); } }
@keyframes oo-flow { to { stroke-dashoffset: -12; } }
@keyframes oo-ripple { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.45); opacity: 0; } }
@keyframes oo-in { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 30px)) scale(.96); } }
@keyframes oo-twinkle { 50% { opacity: .35; } }

/* ---------- Phones and narrow tablets: stack, open descriptions in place ---------- */
@media (max-width: 860px) {
  .one-orbit .oo-stage { grid-template-columns: 1fr; row-gap: 1rem; justify-items: center; }
  .one-orbit .oo-hub { order: -1; width: min(66vw, 270px); margin-bottom: 1.75rem; }
  .one-orbit .oo-col { width: min(100%, 30rem); justify-items: stretch; }
  .one-orbit .oo-links { display: none; }
  .one-orbit button.oo-pill { width: 100%; translate: none !important; min-height: 76px; }
  .one-orbit .oo-col--left .oo-pill { flex-direction: row; text-align: left; padding-left: .55rem; padding-right: 1.5rem; }
  .one-orbit .oo-pill:hover, .one-orbit .oo-pill:focus-visible, .one-orbit .oo-pill.active { transform: translateY(-2px); }
  .one-orbit .oo-icon { width: 60px; }
  .one-orbit .oo-col .oo-detail { width: 100%; }
  .one-orbit .oo-col .oo-clip { padding-bottom: 12px; margin-bottom: -12px; }
}
@media (prefers-reduced-motion: reduce) {
  .one-orbit *, .one-orbit *::before, .one-orbit *::after { animation: none !important; transition-duration: .01ms !important; }
  .one-orbit .oo-disc { transform: none !important; }
}
</style>

<section class="one-orbit" id="one-orbit" aria-label="ONE Platform">
  <div class="oo-wrap">
    <div class="oo-stage" id="oo-stage">
      <svg class="oo-links" id="oo-links" aria-hidden="true"></svg>
      <div class="oo-col oo-col--left" id="oo-left"></div>
      <div class="oo-hub" id="oo-hub">
        <svg class="oo-halo" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="h1" cx="50" cy="50" r="47"></circle>
          <circle class="h2" cx="50" cy="50" r="44"></circle>
          <circle class="h3" cx="50" cy="50" r="47"></circle>
          <circle class="h4" cx="50" cy="50" r="44"></circle>
        </svg>
        <div class="oo-disc" id="oo-disc">
          <svg class="oo-globe" id="oo-globe" viewBox="0 0 200 200" aria-hidden="true"></svg>
          <div class="oo-logo" role="img" aria-label="ONE Platform">
            <svg viewBox="0 0 250 120" aria-hidden="true">
              <defs>
                <linearGradient id="oo-play" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd3ff"></stop><stop offset="1" stop-color="#1a8bf0"></stop></linearGradient>
              </defs>
              <circle cx="41" cy="45" r="31" fill="none" stroke="#fff" stroke-width="17"></circle>
              <path d="M34 31 L56 45 L34 59 Z" fill="url(#oo-play)" stroke="url(#oo-play)" stroke-width="4" stroke-linejoin="round"></path>
              <text x="83" y="77" fill="#fff" font-family="Plus Jakarta Sans, Segoe UI, system-ui, sans-serif" font-weight="800" font-size="88" letter-spacing="-4">NE</text>
              <text x="125" y="114" fill="#fff" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, system-ui, sans-serif" font-weight="700" font-size="24" letter-spacing="7.5">PLATFORM</text>
            </svg>

</section>

<script>
(function () {
  /* ======================================================================
     EDIT HERE
     CENTER_IMAGE: optional URL of an image that replaces the built-in
       ONE Platform logo and globe in the center. Leave "" to keep the built-in one.
     AREAS: 8 items. The first 4 run down the LEFT side, the last 4 run down
       the RIGHT side, top to bottom.
       name   = bold label on the pill (also the small tag on the card)
       sub    = second line on the pill (also the card title)
       text   = description shown in the card
       link   = optional button on the card, e.g. { text: "Learn more", href: "/young-people" }
                Leave as null for no button.
       color  = connector and accent color, tint = pill background, iconBg = icon circle
     ====================================================================== */
  var CENTER_IMAGE = "";
  var CENTER_ALT = "ONE Platform";

  var AREAS = [
    { name: "Young People", sub: "Real Answers", icon: "people",
      text: "Truthful, factual and age-appropriate drug education resources designed for young people.",
      color: "#1ea7ec", tint: "#dcf4fd", iconBg: "#7cc8f0", link: null },
    { name: "Parents & Families", sub: "Parent Education", icon: "family",
      text: "Resources being developed to help families understand drug issues and communicate more effectively.",
      color: "#4cbf3c", tint: "#e6f8e2", iconBg: "#a5e095", link: null },
    { name: "Schools & Educators", sub: "Curriculum & Tools", icon: "cap",
      text: "Educational resources, classroom tools and training for educators and schools.",
      color: "#f5a524", tint: "#fcedcc", iconBg: "#fbc85a", link: null },
    { name: "Courses & Certification", sub: "Professional Training", icon: "certificate",
      text: "Professional education, live training and certification programs for educators and community professionals.",
      color: "#9b6cf0", tint: "#ebe6fd", iconBg: "#c9adfa", link: null },
    { name: "Courts & Referrals", sub: "First-Time Offender", icon: "scales",
      text: "Course infrastructure designed to support future referrals, enrollment and completion.",
      color: "#ef5d74", tint: "#fde6e9", iconBg: "#fb9fac", link: null },
    { name: "Employers", sub: "Workplace Education", icon: "building",
      text: "Workplace drug education resources and organizational training currently in development.",
      color: "#2f8ff0", tint: "#ddedfc", iconBg: "#91cefc", link: null },
    { name: "Research & Content", sub: "The Real Cost", icon: "bars",
      text: "Research and publication resources being developed to make complex drug information easier to understand and use.",
      color: "#22b453", tint: "#e6f8e9", iconBg: "#8fe0a0", link: null },
    { name: "Measurement & Analytics", sub: "Track What Works", icon: "trend",
      text: "Future systems planned to support participation data, surveys and responsible program measurement.",
      color: "#9b6cf0", tint: "#ebe0fd", iconBg: "#c8a1fb", link: null }
  ];

  /* Icons available: people, family, cap, certificate, scales, building, bars, trend */
  var ICONS = {
    people: '<g fill="currentColor" stroke="none"><circle cx="12" cy="7.2" r="3.3"/><path d="M5.6 19.6c0-3.7 2.9-6.6 6.4-6.6s6.4 2.9 6.4 6.6z"/><circle cx="4.9" cy="9.3" r="2.4"/><circle cx="19.1" cy="9.3" r="2.4"/><path d="M.6 18.6c0-2.7 1.9-4.7 4.3-4.7 1 0 1.9.3 2.6.9a8.2 8.2 0 0 0-2.6 3.8z"/><path d="M23.4 18.6c0-2.7-1.9-4.7-4.3-4.7-1 0-1.9.3-2.6.9a8.2 8.2 0 0 1 2.6 3.8z"/></g>',
    family: '<g fill="currentColor" stroke="none"><circle cx="6.5" cy="3.9" r="2.3"/><path d="M4 7.4h5l1 7H8.6V22H4.4v-7.6H3z"/><circle cx="13.3" cy="6.6" r="1.9"/><path d="M11.4 9.6h3.8l.8 5.2h-1.1V22h-3.2v-7.2h-1.1z"/><circle cx="19.4" cy="10.4" r="1.6"/><path d="M17.8 12.9h3.2l.6 4h-.9V22h-2.6v-5.1h-.9z"/></g>',
    cap: '<g fill="currentColor" stroke="none"><path d="M12 3.5 .8 8.8 12 14.1l9.2-4.3v5.6h1.7V8.8z"/><path d="M5.4 12.2v4.3c0 1.9 3 3.6 6.6 3.6s6.6-1.7 6.6-3.6v-4.3L12 15.4z"/><circle cx="22" cy="17" r="1.3"/></g>',
    certificate: '<path d="M14 2.8H6.2a1.4 1.4 0 0 0-1.4 1.4v15.6a1.4 1.4 0 0 0 1.4 1.4H12"/><path d="M14 2.8 19.2 8v4"/><path d="M14 2.8V8h5.2"/><path d="M8 11h7.5M8 14h5M8 17h3"/><circle cx="17.2" cy="16.4" r="2.8" fill="currentColor"/><path d="m15.6 18.8-.8 3.6 2.4-1.2 2.4 1.2-.8-3.6" fill="currentColor"/>',
    scales: '<path d="M12 3.5v16.5"/><path d="M7 21h10"/><path d="M4 6.5c2.7.9 5.3.9 8 0s5.3-.9 8 0"/><circle cx="12" cy="3.5" r="1.3" fill="currentColor"/><path d="M4 6.5 1.3 13h5.4zM20 6.5 17.3 13h5.4z"/><path d="M1.3 13a2.7 2.7 0 0 0 5.4 0zM17.3 13a2.7 2.7 0 0 0 5.4 0z" fill="currentColor"/>',
    building: '<g fill="currentColor" stroke="none"><path d="M4.5 2.5h10.5v19H4.5z"/><path d="M15.8 8.5h4.2v13h-4.2z"/><path d="M2.5 20.6h19v1.4h-19z"/></g><g fill="#fff" stroke="none" opacity=".9"><rect x="6.5" y="5" width="2.2" height="2.2"/><rect x="10.8" y="5" width="2.2" height="2.2"/><rect x="6.5" y="9" width="2.2" height="2.2"/><rect x="10.8" y="9" width="2.2" height="2.2"/><rect x="6.5" y="13" width="2.2" height="2.2"/><rect x="10.8" y="13" width="2.2" height="2.2"/><rect x="17" y="11" width="1.8" height="1.8"/><rect x="17" y="14.6" width="1.8" height="1.8"/><rect x="8.6" y="17.2" width="2.4" height="3.4"/></g>',
    bars: '<g fill="currentColor" stroke="none"><rect x="3.6" y="13" width="4" height="6.6" rx=".8"/><rect x="10" y="8.6" width="4" height="11" rx=".8"/><rect x="16.4" y="3.6" width="4" height="16" rx=".8"/></g><path d="M2.4 21.4h19.2"/>',
    trend: '<path d="M3 17.5 8.6 11l4 4L20.4 6"/><path d="M15 5.6h5.6v5.6"/><path d="M2.6 21.2h18.8"/>'

  /* ====================================================================== */

  function init() {
    var root = document.getElementById("one-orbit");
    if (!root || root.dataset.ready) return;
    root.dataset.ready = "1";

    var stage = document.getElementById("oo-stage");
    var cols = [document.getElementById("oo-left"), document.getElementById("oo-right")];
    var hub = document.getElementById("oo-hub");
    var disc = document.getElementById("oo-disc");
    var links = document.getElementById("oo-links");
    var detail = document.getElementById("oo-detail");
    var detailHome = detail.parentNode;
    var stack = document.getElementById("oo-stack");
    var hint = document.getElementById("oo-hint");
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var canHover = window.matchMedia("(hover: hover)").matches;
    var narrow = window.matchMedia("(max-width: 860px)");
    var NS = "http://www.w3.org/2000/svg";
    var active = null, hoverTimer = null, sparkRaf = null;

    function svgIcon(name) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
    }
    function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function el(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

    if (CENTER_IMAGE) {
      var img = new Image();
      img.src = CENTER_IMAGE; img.alt = CENTER_ALT;
      disc.appendChild(img);
      hub.classList.add("has-image");
    }

    // Globe: a planet rising from the bottom of the disc, with a twinkling network on it.
    (function drawGlobe() {
      var g = document.getElementById("oo-globe");
      g.innerHTML =
        '<defs><radialGradient id="oo-planet" cx="50%" cy="0%" r="75%"><stop offset="0" stop-color="#2fb8ff" stop-opacity=".9"/><stop offset=".35" stop-color="#0b5fc0" stop-opacity=".55"/><stop offset="1" stop-color="#04173d" stop-opacity="0"/></radialGradient>' +
        '<clipPath id="oo-clip"><circle cx="100" cy="245" r="105"/></clipPath></defs>' +
        '<circle cx="100" cy="245" r="105" fill="url(#oo-planet)"/>' +
        '<circle cx="100" cy="245" r="105" fill="none" stroke="#7fdcff" stroke-width="1.2" opacity=".9"/>';
      var grid = el("g", { "clip-path": "url(#oo-clip)", fill: "none", stroke: "#5fc8ff", "stroke-width": ".35", opacity: ".45" });
      [30, 55, 80].forEach(function (rx) { grid.appendChild(el("ellipse", { cx: 100, cy: 245, rx: rx, ry: 105 })); });
      [150, 160, 172].forEach(function (y) { grid.appendChild(el("line", { x1: 0, y1: y, x2: 200, y2: y })); });
      g.appendChild(grid);
      var seed = 7; function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
      var pts = [];
      while (pts.length < 26) {
        var x = 30 + rnd() * 140, y = 143 + rnd() * 50;
        if (Math.hypot(x - 100, y - 245) < 103) pts.push([x, y]);
      }
      var net = el("g", { stroke: "#8fe3ff", "stroke-width": ".4", opacity: ".55" });
      pts.forEach(function (p, i) {
        pts.slice(i + 1).forEach(function (q) {
          if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 22) net.appendChild(el("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1] }));
        });
      });
      g.appendChild(net);
      pts.forEach(function (p, i) {
        var d = el("circle", { cx: p[0], cy: p[1], r: i % 4 ? .9 : 1.5, class: "gd" });
        d.style.animationDelay = (i * 0.23 % 3).toFixed(2) + "s";
        g.appendChild(d);
      });
    })();

    // Pills and their description cards
    var pills = [], cards = [];
    AREAS.forEach(function (a, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "oo-pill";
      b.dataset.row = i % 4;
      b.style.cssText = "--pc:" + a.color + ";--pt:" + a.tint + ";--pi:" + a.iconBg + ";--i:" + i;
      b.setAttribute("aria-expanded", "false");
      b.setAttribute("aria-controls", "oo-detail");
      b.innerHTML = '<span class="oo-icon">' + svgIcon(a.icon) + '</span><span class="oo-text"><span class="oo-name">' + esc(a.name) + '</span><span class="oo-sub">' + esc(a.sub) + "</span></span>";
      cols[i < 4 ? 0 : 1].appendChild(b);
      pills.push(b);

      var c = document.createElement("article");
      c.className = "oo-card";
      c.style.cssText = "--pc:" + a.color + ";--pt:" + a.tint;
      c.setAttribute("aria-label", a.name);
      c.innerHTML =
        '<button type="button" class="oo-close" data-close aria-label="Close">&times;</button>' +
        '<span class="oo-tag">' + esc(a.name) + "</span>" +
        "<h3>" + esc(a.sub) + "</h3>" +
        "<p>" + esc(a.text) + "</p>" +
        '<div class="oo-foot">' +
          (a.link && a.link.href ? '<a class="oo-btn oo-btn--fill" href="' + esc(a.link.href) + '">' + esc(a.link.text || "Learn more") + "</a>" : "") +
          '<div class="oo-nav"><button type="button" class="oo-btn" data-step="-1" aria-label="Previous area">&larr; Prev</button>' +
          '<button type="button" class="oo-btn" data-step="1" aria-label="Next area">Next &rarr;</button></div>' +
        "</div>";
      stack.appendChild(c);
      cards.push(c);
    });

    // Connectors: dotted elbow lines from each pill to a point on the disc edge.
    var ANGLES = [-100, 200, 160, 100, -80, -20, 20, 80];
    var paths = [], sparks = [];
    function drawLinks() {
      links.innerHTML = "";
      paths = []; sparks = [];
      if (narrow.matches) return;
      var s = stage.getBoundingClientRect();
      var d = disc.getBoundingClientRect();
      var cx = d.left + d.width / 2 - s.left, cy = d.top + d.height / 2 - s.top, r = d.width / 2 + 14;
      AREAS.forEach(function (a, i) {
        var p = pills[i].getBoundingClientRect();
        var left = i < 4;
        var ax = (left ? p.right + 12 : p.left - 12) - s.left, ay = p.top + p.height / 2 - s.top;
        var t = ANGLES[i] * Math.PI / 180;
        var bx = cx + r * Math.cos(t), by = cy + r * Math.sin(t);
        var dPath;
        if (Math.abs(by - ay) > 40) {
          var rad = 14, sy = by > ay ? 1 : -1, sx = bx > ax ? 1 : -1;
          dPath = "M" + ax + " " + ay + " H" + (bx - sx * rad) + " Q" + bx + " " + ay + " " + bx + " " + (ay + sy * rad) + " V" + by;
        } else {
          dPath = "M" + ax + " " + ay + " H" + ((ax + bx) / 2) + " L" + bx + " " + by;
        }
        var g = el("g", {}); g.style.setProperty("--lc", a.color);
        var path = el("path", { d: dPath, class: "oo-link" + (i === active ? " on" : "") });
        g.appendChild(path);
        g.appendChild(el("circle", { cx: ax, cy: ay, r: 5, class: "oo-end" }));
        g.appendChild(el("circle", { cx: bx, cy: by, r: 5, class: "oo-end" }));
        var sp = el("circle", { r: 5, class: "oo-spark" });
        g.appendChild(sp);
        links.appendChild(g);
        paths.push(path); sparks.push(sp);
      });
      if (active !== null) runSpark(active);
    }

    // A light that travels along the active connector from the disc out to the pill.
    function runSpark(i) {
      cancelAnimationFrame(sparkRaf);
      sparks.forEach(function (s) { s.style.opacity = "0"; });
      if (!paths[i] || reduceMotion) return;
      var path = paths[i], sp = sparks[i], len = path.getTotalLength(), t0 = performance.now();
      (function tick(now) {
        var p = ((now - t0) % 1600) / 1600;
        var e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        var pt = path.getPointAtLength(len * (1 - e));
        sp.setAttribute("cx", pt.x); sp.setAttribute("cy", pt.y);
        sp.style.opacity = String(Math.sin(p * Math.PI));
        sparkRaf = requestAnimationFrame(tick);
      })(t0);
    }

    // The card area takes the height of the card being shown.
    function fitStack() {
      if (active !== null) stack.style.height = cards[active].offsetHeight + "px";
    }

    // On phones the description opens directly under the tapped pill.
    function placeDetail() {
      if (narrow.matches && active !== null) pills[active].after(detail);
      else if (detail.parentNode !== detailHome) detailHome.appendChild(detail);
    }

    function select(i) {
      if (i === active) return;
      var moving = narrow.matches && active !== null && i !== null;
      active = i;
      pills.forEach(function (p, k) {
        p.classList.toggle("active", k === i);
        p.setAttribute("aria-expanded", String(k === i));
        cards[k].classList.toggle("show", k === i);
        if (paths[k]) paths[k].classList.toggle("on", k === i);
      });
      root.classList.toggle("is-active", i !== null);
      hint.hidden = i !== null;
      if (i !== null) {
        root.style.setProperty("--c", AREAS[i].color);
        runSpark(i);
      } else {
        cancelAnimationFrame(sparkRaf);
        sparks.forEach(function (s) { s.style.opacity = "0"; });
      }
      if (moving) { detail.classList.remove("open"); placeDetail(); void detail.offsetWidth; }
      else placeDetail();
      fitStack();
      detail.classList.toggle("open", i !== null);
      if (narrow.matches && i !== null) {
        var target = pills[i];
        setTimeout(function () {
          var r = target.getBoundingClientRect();
          if (r.top < 0 || r.top > window.innerHeight * .45) window.scrollBy({ top: r.top - 90, behavior: reduceMotion ? "auto" : "smooth" });
        }, 80);
      }
    }

    pills.forEach(function (p, i) {
      // Hover opens an area after a short pause, so crossing other pills
      // doesn't switch it. It stays open until another area is chosen.
      p.addEventListener("pointerenter", function (e) {
        if (e.pointerType !== "mouse" || narrow.matches) return;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(function () { select(i); }, active === null ? 0 : 140);
      });
      p.addEventListener("pointerleave", function () { clearTimeout(hoverTimer); });
      p.addEventListener("click", function () {
        clearTimeout(hoverTimer);
        // Tapping the open area again closes it (phones and touch screens).
        select(active === i && (!canHover || narrow.matches) ? null : i);
      });
      p.addEventListener("keydown", function (e) {
        var k = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
        if (k) { e.preventDefault(); pills[(i + k + pills.length) % pills.length].focus(); }
      });
    });

    stack.addEventListener("click", function (e) {
      if (e.target.closest("[data-close]")) {
        var was = active; select(null);
        if (was !== null) pills[was].focus({ preventScroll: true });
        return;
      }
      var s = e.target.closest("[data-step]");
      if (s) select((active + Number(s.dataset.step) + AREAS.length) % AREAS.length);
    });
    root.addEventListener("keydown", function (e) { if (e.key === "Escape") select(null); });

    // The disc tilts gently toward the cursor.
    stage.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse" || reduceMotion) return;
      var r = disc.getBoundingClientRect();
      var px = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (r.width * 2)));
      var py = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (r.height * 2)));
      disc.style.setProperty("--rx", (px * 14).toFixed(2) + "deg");
      disc.style.setProperty("--ry", (-py * 14).toFixed(2) + "deg");
    });
    stage.addEventListener("pointerleave", function () { disc.style.setProperty("--rx", "0deg"); disc.style.setProperty("--ry", "0deg"); });

    // Redraw connectors whenever the layout changes (resize, fonts loading, entrance animation ending).
    var raf = null;
    function schedule() { cancelAnimationFrame(raf); raf = requestAnimationFrame(function () { drawLinks(); fitStack(); }); }
    if (window.ResizeObserver) new ResizeObserver(schedule).observe(stage);
    window.addEventListener("resize", schedule);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
    pills[pills.length - 1].addEventListener("animationend", schedule);
    var onNarrow = function () { placeDetail(); schedule(); };
    if (narrow.addEventListener) narrow.addEventListener("change", onNarrow); else narrow.addListener(onNarrow);
    drawLinks();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
