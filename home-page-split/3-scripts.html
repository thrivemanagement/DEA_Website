<script>
(function () {

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Numbers count up from zero the first time they scroll into view. */
  var counters = document.querySelectorAll(".dea-count");

  if (counters.length && !reduceMotion && "IntersectionObserver" in window) {
    var countUp = function (el) {
      var target = Number(el.getAttribute("data-count"));
      var start = performance.now();
      var step = function (now) {
        var t = Math.min((now - start) / 2200, 1);
        var eased = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(target * eased).toLocaleString("en-US");
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };

    var seen = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          seen.unobserve(entry.target);
          countUp(entry.target);
        }
      });
    }, { threshold: 0.5 });

    counters.forEach(function (el) {
      el.textContent = "0";
      seen.observe(el);
    });
  }

  /* Logo strip: duplicate the list so the scroll loops, and wire up pause. */
  var logos = document.getElementById("dea-logos");

  if (logos) {
    var lists = logos.querySelectorAll(".dea-logo-list");
    lists[1].innerHTML = lists[0].innerHTML;
    lists[1].querySelectorAll("img").forEach(function (img) { img.alt = ""; });
    lists[1].querySelectorAll("a").forEach(function (a) { a.tabIndex = -1; });

    var pause = logos.querySelector(".dea-logo-pause");
    pause.addEventListener("click", function () {
      var paused = logos.classList.toggle("is-paused");
      pause.setAttribute("aria-pressed", String(paused));
      pause.setAttribute("aria-label", paused ? "Play logo scrolling" : "Pause logo scrolling");
    });
  }

})();
</script>
